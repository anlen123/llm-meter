[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-meter"
version = "0.4.0"
description = "Terminal usage dashboard for Codex and OpenAI-compatible providers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llm-meter = "llm_meter:cli"

[tool.setuptools]
py-modules = ["llm_meter", "llm_meter_web", "llm_meter_connections"]
packages = ["meter_static"]

[tool.setuptools.package-data]
meter_static = ["*.html", "*.css", "*.js"]
